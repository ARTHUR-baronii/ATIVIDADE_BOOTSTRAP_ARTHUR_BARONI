<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário Completo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #0f172a;
            color: white;
        }

        .navbar {
            background-color: #111827;
        }

        .card {
            background-color: #1e293b;
            color: white;
            border: 1px solid #334155;
        }

        .form-control,
        .form-select {
            background-color: #0f172a;
            color: white;
            border: 1px solid #475569;
        }

        .form-control:focus,
        .form-select:focus {
            background-color: #0f172a;
            color: white;
            border-color: #7c3aed;
            box-shadow: 0 0 0 0.2rem rgba(124, 58, 237, 0.25);
        }

        .form-control::placeholder {
            color: #94a3b8;
        }

        .btn-purple {
            background-color: #7c3aed;
            color: white;
        }

        .btn-purple:hover {
            background-color: #6d28d9;
            color: white;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">TechZone</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>

                <li class="nav-item"><a class="nav-link" href="desafio02.html">Desafio 02</a></li>
                <li class="nav-item"><a class="nav-link" href="desafio03.html">Desafio 03</a></li>
                <li class="nav-item"><a class="nav-link active" href="desafio04.html">Desafio 04</a></li>
                <li class="nav-item"><a class="nav-link" href="desafio05.html">Desafio 05</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-5 mb-5">

    <div class="text-center mb-4">
        <h1 class="fw-bold">Agendamento de Atendimento</h1>
        <p>Preencha os dados abaixo para solicitar um atendimento.</p>
    </div>

    <div class="row justify-content-center">

        <div class="col-12 col-lg-9">

            <div class="card p-4">

                <form>

                    <h4 class="mb-3">Dados do cliente</h4>

                    <div class="row g-3">

                        <div class="col-12 col-md-6">
                            <label class="form-label">Nome completo</label>
                            <input type="text" class="form-control" placeholder="Digite seu nome" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="form-label">CPF</label>
                            <input type="text" class="form-control" placeholder="000.000.000-00" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="form-label">E-mail</label>
                            <input type="email" class="form-control" placeholder="seuemail@email.com" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="form-label">Telefone</label>

                            <div class="input-group">
                                <span class="input-group-text">+55</span>
                                <input type="tel" class="form-control" placeholder="(41) 99999-9999" required>
                            </div>
                        </div>

                    </div>

                    <hr class="my-4">

                    <h4 class="mb-3">Informações do equipamento</h4>

                    <div class="row g-3">

                        <div class="col-12 col-md-6">
                            <label class="form-label">Equipamento</label>

                            <select class="form-select" required>
                                <option value="">Selecione</option>
                                <option>Notebook</option>
                                <option>Computador</option>
                                <option>Celular</option>
                                <option>Tablet</option>
                                <option>Outro</option>
                            </select>
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="form-label">Tipo de serviço</label>

                            <select class="form-select" required>
                                <option value="">Selecione</option>
                                <option>Formatação</option>
                                <option>Manutenção</option>
                                <option>Instalação de programas</option>
                                <option>Upgrade</option>
                                <option>Reparo</option>
                                <option>Limpeza</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Valor estimado</label>

                            <div class="input-group">
                                <span class="input-group-text">R$</span>
                                <input type="number" class="form-control" placeholder="0,00">
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Descrição do problema</label>

                            <textarea class="form-control" rows="4"
                                placeholder="Descreva o problema do equipamento"></textarea>
                        </div>

                    </div>

                    <div class="form-check mt-4">
                        <input class="form-check-input" type="checkbox" id="confirmacao" required>
                        <label class="form-check-label" for="confirmacao">
                            Confirmo que as informações fornecidas estão corretas.
                        </label>
                    </div>

                    <button type="submit" class="btn btn-purple w-100 mt-4">
                        Enviar solicitação
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

<footer class="text-center py-4">
    <p>TechFix | Assistência Técnica</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
